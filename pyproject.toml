[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shut-your-pyhole"
# Single source of truth: src/syp/__init__.py. Two copies of a version number
# is one copy too many.
dynamic = ["version"]
description = "Repository readiness audit for research code. Because `pip install -r requirements.txt` was never the whole story."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Knut Domeier" }]
keywords = [
    "reproducibility", "dependencies", "audit", "machine-learning",
    "research-code", "docker", "cuda", "provenance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Installation/Setup",
    "Topic :: Utilities",
]
# tomllib is stdlib from 3.11; older interpreters need tomli to read
# pyproject.toml and .syp.toml properly rather than falling back to a regex.
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/0x60A7/shut-your-PyHole"
Repository = "https://github.com/0x60A7/shut-your-PyHole"
Issues = "https://github.com/0x60A7/shut-your-PyHole/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
# `syp` is the name the docs use. `pyhole` is an unambiguous alias: an unrelated
# `syp` package exists on PyPI and may install a command of the same name.
syp = "syp.cli:main"
pyhole = "syp.cli:main"

[tool.hatch.version]
path = "src/syp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/syp"]

[tool.hatch.build.targets.sdist]
include = ["src/syp", "tests", "README.md", "LICENSE", "pyproject.toml", ".syp.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
