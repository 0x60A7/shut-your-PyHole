name: publish

# Publishing uses PyPI Trusted Publishing (OIDC), so no API token is stored in
# this repository and none has to be handled by hand. Configure it once at
# https://pypi.org/manage/project/shut-your-pyhole/settings/publishing/ with:
#   owner: 0x60A7   repository: shut-your-PyHole
#   workflow: publish.yml   environment: pypi
#
# Then publish by creating a GitHub release, or run this workflow manually
# against TestPyPI first.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Index to publish to"
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A tag that disagrees with the package version is the classic release
      # footgun, and PyPI will not let you take a wrong number back.
      - name: Tag must match the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import pathlib, re; print(re.search(r'__version__ = .(.*).', pathlib.Path('src/syp/__init__.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "package=$version tag=$tag"
          test -n "$version"
          test "$version" = "$tag"

      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'release' || inputs.repository == 'pypi') && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write        # required for trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: >-
            ${{ (github.event_name == 'release' || inputs.repository == 'pypi')
                && 'https://upload.pypi.org/legacy/'
                || 'https://test.pypi.org/legacy/' }}
